server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: qualquer rota não-arquivo cai no index.html
    # para o Vue Router resolver client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
}
